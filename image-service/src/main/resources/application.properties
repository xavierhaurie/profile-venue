spring.application.name=image-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/images}
spring.datasource.username=${DB_USER:images}
spring.datasource.password=${DB_PASSWORD:imagespass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
gcs.bucket=${GCS_BUCKET:}
local.storage.dir=${LOCAL_STORAGE_DIR:./uploads}