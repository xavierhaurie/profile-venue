spring.application.name=image-service
server.port=8083

# database name should not be image, that causes a connection failure.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/image}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
gcs.bucket=${GCS_BUCKET:}
local.storage.dir=${LOCAL_STORAGE_DIR:./uploads}