spring.application.name=profile-venue-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/artistprofile}
spring.datasource.username=${DB_USER:artist}
spring.datasource.password=${DB_PASSWORD:artistpass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true